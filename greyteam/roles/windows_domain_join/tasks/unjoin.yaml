---
# Attempt clean domain unjoin (best case)
- name: Attempt clean domain unjoin
  microsoft.ad.membership:
    state: workgroup
    workgroup_name: WORKGROUP
    domain_admin_user: "{{ greyteam_user }}@{{ domain }}"
    domain_admin_password: "{{ greyteam_password }}"
    domain_server: canterlot.{{ domain }}
    reboot: false
  register: unjoin_attempt
  ignore_errors: true

# HARD FAILOVER: local-admin forced unjoin (NO domain auth)
- name: Force local unjoin when trust is broken
  ansible.windows.win_shell: |
    Remove-Computer `
      -WorkgroupName 'WORKGROUP' `
      -Force `
      -Restart
  args:
    executable: powershell.exe
  when: unjoin_attempt is failed
  become: true
  become_method: runas
  become_user: Administrator