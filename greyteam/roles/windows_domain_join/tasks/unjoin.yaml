---
# Attempt clean domain unjoin (best case)
- name: Attempt clean domain unjoin
  microsoft.ad.membership:
    state: workgroup
    workgroup_name: WORKGROUP
    domain_admin_user: "{{ greyteam_user }}@{{ domain }}"
    domain_admin_password: "{{ greyteam_password }}"
    domain_server: canterlot.{{ domain }}
    reboot: false
  register: unjoin_attempt
  ignore_errors: true

# HARD FAILOVER: unjoin as SYSTEM (works even when admin is disabled)
- name: Force unjoin as SYSTEM using scheduled task
  ansible.windows.win_shell: |
    $action = New-ScheduledTaskAction -Execute "powershell.exe" -Argument `
      "Remove-Computer -WorkgroupName 'WORKGROUP' -Force -Restart"

    $principal = New-ScheduledTaskPrincipal `
      -UserId "SYSTEM" `
      -LogonType ServiceAccount `
      -RunLevel Highest

    $task = New-ScheduledTask `
      -Action $action `
      -Principal $principal

    Register-ScheduledTask `
      -TaskName "ForceDomainUnjoin" `
      -InputObject $task `
      -Force

    Start-ScheduledTask -TaskName "ForceDomainUnjoin"
  when: unjoin_attempt is failed