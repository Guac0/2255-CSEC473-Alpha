---
# Attempt a clean, supported domain unjoin first
- name: Attempt clean domain unjoin
  microsoft.ad.membership:
    state: workgroup
    workgroup_name: WORKGROUP
    domain_admin_user: "{{ greyteam_user }}"
    domain_admin_password: "{{ greyteam_password }}"
    domain_server: canterlot.mlp.local
    reboot: false
  register: unjoin_attempt
  ignore_errors: true

# Force unjoin if SID mapping / trust is broken
- name: Force unjoin if SID mapping fails (explicit credentials)
  ansible.windows.win_shell: |
    $sec = ConvertTo-SecureString "{{ greyteam_password }}" -AsPlainText -Force
    $cred = New-Object System.Management.Automation.PSCredential("MLP\greyteam", $sec)

    Remove-Computer `
      -WorkgroupName "WORKGROUP" `
      -Credential $cred `
      -Force `
      -Restart
  args:
    executable: powershell.exe
  when: unjoin_attempt is failed