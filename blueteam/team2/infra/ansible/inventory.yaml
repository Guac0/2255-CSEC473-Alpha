all:
  children:
    iis:
      hosts:
        armory:
          ansible_host: "10.2.1.1"
          magpie_agent_name: iis
          magpie_disarm: true
          magpie_ports: [80,443]
          magpie_services: ["W3SVC"]
          magpie_packages: ["Web-Server"]
          magpie_protected_folders: ["C:\\Windows\\System32\\inetsrv\\config","C:\\inetpub\\wwwroot","C:\\Windows\\System32\\inetsrv\\w3wp.exe","C:\\Windows\\System32\\inetsrv\\inetmgr.exe"]
    smb:
      hosts:
        sewers:
          ansible_host: "10.2.1.2"
          magpie_agent_name: smb
          magpie_disarm: true
          magpie_ports: [445,137,138,139]
          magpie_services: ["LanmanServer"]
          magpie_packages: ["FS-FileServer"]
          magpie_protected_folders: ["C:\\Shares","C:\\Windows\\System32\\srv2.sys"]
    dns:
      hosts:
        fortress:
          ansible_host: "10.2.1.3"
          magpie_agent_name: dns
          magpie_disarm: true
          magpie_ports: [53]
          magpie_services: ["DNS"]
          magpie_packages: ["DNS"]
          magpie_protected_folders: ["C:\\Windows\\System32\\dns","C:\\Windows\\System32\\dns.exe"] #C:\Windows\NTDS\
    ad:
      children:
        dns:
    dc:
