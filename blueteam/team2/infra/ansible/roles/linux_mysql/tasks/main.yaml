---
- name: Update apt cache and install MySQL Server
  apt:
    name: mysql-server
    state: present
    update_cache: yes

- name: Ensure MySQL is started and enabled
  service:
    name: mysql
    state: started
    enabled: yes

- name: Allow MySQL to bind to all IP addresses (Remote Access)
  lineinfile:
    path: /etc/mysql/mysql.conf.d/mysqld.cnf
    regexp: '^bind-address'
    line: 'bind-address            = 0.0.0.0'

- name: Restart MySQL
  service:
    name: mysql
    state: restarted

- name: Update MySQL root password and authentication method
  shell: |
    mysql -e "ALTER USER 'root'@'localhost' IDENTIFIED WITH 'mysql_native_password' BY '{{ team_password }}';"
    mysql -e "FLUSH PRIVILEGES;"
  register: auth_update
  changed_when: auth_update.rc == 0

- name: Update MySQL root password and authentication method
  community.mysql.mysql_user:
    name: root
    host: "{{ item }}"
    password: "{{ team_password }}"
    plugin: mysql_native_password
    priv: "*.*:ALL,GRANT"
    state: present
    # This allows the module to connect via the local socket as root
    login_unix_socket: /var/run/mysqld/mysqld.sock
  loop:
    - localhost
    - 127.0.0.1
    - ::1
    - "%"  # This replaces your "Allow root access from any host" task