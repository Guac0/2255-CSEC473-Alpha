<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Management Editor | Scoring Engine</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        body { background-color: #020617; color: #f1f5f9; font-size: 1.1rem; }
        .pane-container { height: calc(100vh - 160px); }
        .sidebar-active { background-color: #1e293b; border-right: 4px solid #3b82f6; }
        .criteria-text { font-size: 1.25rem; line-height: 1.75rem; }
        #toast { transition: opacity 0.3s ease, transform 0.3s ease; }
    </style>
</head>
<body class="p-6">
    <div id="toast" class="fixed top-5 right-5 z-[100] hidden transform translate-y-[-20px]">
        <div id="toast-msg" class="px-6 py-3 rounded-lg shadow-2xl font-bold border"></div>
    </div>

    <header class="flex justify-between items-center mb-8 border-b border-slate-800 pb-6">
        <div>
            <h1 class="text-3xl font-black tracking-tight text-white uppercase">System Configuration</h1>
            <p class="text-slate-400 text-lg">Manage credentials and scoring logic</p>
        </div>
        <a href="scoreboard" class="bg-slate-800 hover:bg-slate-700 text-white px-6 py-3 rounded-xl font-bold transition flex items-center border border-slate-700">
            <svg class="w-5 h-5 mr-2" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M10 19l-7-7m0 0l7-7m-7 7h18"/></svg>
            Return to Dashboard
        </a>
    </header>

    <main class="grid grid-cols-1 lg:grid-cols-2 gap-8 pane-container">
        <section class="flex flex-col bg-slate-900/50 rounded-2xl border border-slate-800 overflow-hidden">
            <div class="bg-slate-800/50 p-4 border-b border-slate-800 flex justify-between items-center">
                <h2 class="text-xl font-bold text-blue-400 uppercase tracking-widest">Credential Manager</h2>
            </div>
            <div class="flex flex-1 overflow-hidden">
                <div id="host-list" class="w-1/3 overflow-y-auto border-r border-slate-800 bg-slate-900/80"></div>
                <div id="user-workspace" class="w-2/3 p-6 overflow-y-auto bg-slate-900/20">
                    <div class="h-full flex items-center justify-center text-slate-500 italic">Select a host to view users</div>
                </div>
            </div>
        </section>

        <section id="criteria-section" class="flex flex-col bg-slate-900/50 rounded-2xl border border-slate-800 overflow-hidden">
            <div class="bg-slate-800/50 p-4 border-b border-slate-800 flex justify-between items-center">
                <h2 class="text-xl font-bold text-emerald-400 uppercase tracking-widest">Scoring Logic</h2>
                <button onclick="showNewCriteriaModal()" id="add-btn" class="hidden bg-emerald-600 hover:bg-emerald-500 text-white text-sm px-4 py-2 rounded-lg font-bold transition">
                    + New Requirement
                </button>
            </div>
            <div class="flex flex-1 overflow-hidden">
                <div id="service-list" class="w-1/3 overflow-y-auto border-r border-slate-800 bg-slate-900/80"></div>
                <div id="criteria-workspace" class="w-2/3 p-6 overflow-y-auto bg-slate-900/20">
                    <div class="h-full flex items-center justify-center text-slate-500 italic">Select a service to view criteria</div>
                </div>
            </div>
        </section>
    </main>

    <div id="criteria-modal" class="hidden fixed inset-0 bg-slate-950/90 backdrop-blur-sm flex items-center justify-center z-50">
        <div class="bg-slate-900 p-8 rounded-2xl border border-slate-700 w-full max-w-2xl shadow-2xl">
            <h3 class="text-2xl font-bold mb-6 text-white border-b border-slate-800 pb-4">Add Scoring Criteria</h3>
            <div class="space-y-6">
                <input type="hidden" id="modal-service-id">
                <div>
                    <label id="loc-label-text" class="block text-sm font-bold text-slate-400 mb-2 uppercase tracking-wide">File Location / Target</label>
                    <input type="text" id="new-location" placeholder="/etc/ssh/sshd_config" class="w-full bg-slate-950 border border-slate-700 rounded-lg p-4 text-lg text-emerald-400 focus:border-emerald-500 outline-none">
                </div>
                <div>
                    <label id="content-label-text" class="block text-sm font-bold text-slate-400 mb-2 uppercase tracking-wide">Required Content / Regex</label>
                    <textarea id="new-content" rows="4" placeholder="PermitRootLogin no" class="w-full bg-slate-950 border border-slate-700 rounded-lg p-4 text-lg font-mono text-emerald-400 focus:border-emerald-500 outline-none"></textarea>
                </div>
                <div class="flex justify-end space-x-4 pt-4">
                    <button onclick="toggleModal('criteria-modal')" class="px-6 py-3 text-slate-400 hover:text-white font-bold transition">Cancel</button>
                    <button onclick="submitNewCriteria()" class="bg-emerald-600 hover:bg-emerald-500 px-8 py-3 rounded-xl font-bold shadow-lg transition">Save Requirement</button>
                </div>
            </div>
        </div>
    </div>

<script>
let selectedServiceId = null;
let currentUserRole = '';
const SERVICE_GUIDE = {
    "dns": { location: "DNS record to query:", content: "Expected IP Address:" },
    "mssql": { location: "SQL Query:", content: "Expected Result:" },
    "apache": { location: "URL Path (e.g. /index.php):", content: "Expected Page Content:" },
    "mariadb": { location: "SQL Query:", content: "Expected Result:" },
    "cups": { location: "File Path:", content: "Expected File Hash:" },
    "vsftpd": { location: "Absolute Local Path:", content: "Expected File Content:" },
    "iis": { location: "Port/Path:", content: "Website Content:" },
    "smb": { location: "Absolute Network Path:", content: "File Contents:" },
    "irc": { location: "IRC Channel:", content: "Expected Welcome Message:" }
};
let serviceNamesById = {};
let serviceToHostMap = {};

function notify(message, isError = false) {
    const toast = document.getElementById('toast');
    const msgBox = document.getElementById('toast-msg');
    msgBox.textContent = message;
    msgBox.className = isError 
        ? "px-6 py-3 rounded-lg shadow-2xl font-bold border bg-red-900/80 border-red-500 text-red-100"
        : "px-6 py-3 rounded-lg shadow-2xl font-bold border bg-emerald-900/80 border-emerald-500 text-emerald-100";
    
    toast.classList.remove('hidden');
    setTimeout(() => toast.classList.remove('translate-y-[-20px]', 'opacity-0'), 10);
    
    setTimeout(() => {
        toast.classList.add('translate-y-[-20px]', 'opacity-0');
        setTimeout(() => toast.classList.add('hidden'), 300);
    }, 3000);
}

async function init() {
    try {
        const whoamiRes = await fetch('/whoami');
        const user = await whoamiRes.json();
        currentUserRole = user.role.toLowerCase();
        
        if (currentUserRole === 'blue') {
            const criteriaSection = document.getElementById('criteria-section');
            if (criteriaSection) criteriaSection.remove();
            document.querySelector('main').classList.replace('lg:grid-cols-2', 'max-w-4xl');
            document.querySelector('main').classList.add('mx-auto');
        } else {
            await loadServices();
        }
        await loadHosts();
    } catch (err) {
        notify("Failed to initialize session", true);
    }
}

async function loadHosts() {
    const res = await fetch('/get_hosts');
    const hosts = await res.json();
    const list = document.getElementById('host-list');
    
    list.innerHTML = hosts.map(h => {
        let budgetHtml = '';
        if (currentUserRole === 'blue') {
            const remaining = 3 - (h.pwds_blue || 0);
            budgetHtml = `<span class="text-xl font-mono ${remaining <= 0 ? 'text-blue-500' : 'text-blue-400'}">[${remaining}/3]</span>`;
        } else if (currentUserRole === 'red') {
            const remaining = 3 - (h.pwds_red || 0);
            budgetHtml = `<span class="text-xl font-mono ${remaining <= 0 ? 'text-red-500' : 'text-red-400'}">[${remaining}/3]</span>`;
        } else if (currentUserRole === 'admin') {
            budgetHtml = `<span class="text-sm font-mono text-slate-500">R:${3-h.pwds_red} B:${3-h.pwds_blue}</span>`;
        }

        return `
            <div class="p-5 border-b border-slate-800 cursor-pointer hover:bg-slate-800 transition sidebar-item" 
                 onclick="loadScoringUsers(${h.id}, this)">
                <div class="flex justify-between items-center mb-1">
                    <div class="font-black text-white text-2xl tracking-tighter">${h.hostname}</div>
                    ${budgetHtml}
                </div>
                <div class="text-sm font-mono text-slate-500">${h.ip}</div>
            </div>
        `;
    }).join('');
}

async function loadScoringUsers(hostId, el) {
    document.querySelectorAll('#host-list .sidebar-item').forEach(i => i.classList.remove('sidebar-active'));
    el.classList.add('sidebar-active');
    
    const res = await fetch(`/get_scoring_users?host_id=${hostId}`);
    const users = await res.json();
    const workspace = document.getElementById('user-workspace');
    
    workspace.innerHTML = users.map(u => `
        <div class="bg-slate-800 border border-slate-700 rounded-xl p-6 mb-4 shadow-lg">
            <div class="flex justify-between items-center mb-4">
                <span class="text-blue-400 font-black uppercase tracking-widest text-sm">User Identity</span>
                <span class="text-slate-500 font-mono text-xs">ID: ${u.id}</span>
            </div>
            <div class="text-2xl font-bold text-white mb-6">${u.username}</div>
            <div class="flex space-x-3">
                <input type="password" id="pw-${u.id}" placeholder="New password..." 
                       class="flex-1 bg-slate-950 border border-slate-700 rounded-lg px-4 py-3 text-white outline-none">
                <button onclick="updatePassword(${u.id})" 
                        class="bg-blue-600 hover:bg-blue-500 px-6 py-3 rounded-lg font-bold transition">Update</button>
            </div>
        </div>
    `).join('');
}

async function updatePassword(userId) {
    const pwdInput = document.getElementById(`pw-${userId}`);
    const pwd = pwdInput.value;
    if(!pwd) return notify("Password required", true);

    try {
        const res = await fetch('/update_scoring_user_pwd', {
            method: 'POST',
            headers: {'Content-Type': 'application/json'},
            body: JSON.stringify({ user_id: userId, password: pwd })
        });
        if (res.ok) {
            notify("Credential updated");
            pwdInput.value = '';
            await loadHosts();
        } else { notify("Update failed", true); }
    } catch (e) { notify("Server error", true); }
}

async function loadServices() {
    const res = await fetch('/get_services');
    const services = await res.json();
    const list = document.getElementById('service-list');
    
    services.forEach(s => {
        serviceNamesById[s.id] = s.display_name;
        serviceToHostMap[s.id] = s.host_id;
    });

    list.innerHTML = services.map(s => `
        <div class="p-5 border-b border-slate-800 cursor-pointer hover:bg-slate-800 transition sidebar-item" 
             onclick="loadCriteria(${s.id}, this)">
            <div class="font-black text-white text-lg">${s.display_name}</div>
            <div class="text-sm text-slate-500 uppercase font-bold">${s.hostname}</div>
        </div>
    `).join('');
}

async function loadCriteria(serviceId, el) {
    selectedServiceId = serviceId;
    document.getElementById('add-btn').classList.remove('hidden');
    document.querySelectorAll('#service-list .sidebar-item').forEach(i => i.classList.remove('sidebar-active'));
    el.classList.add('sidebar-active');

    const res = await fetch(`/get_scoring_criteria?service_id=${serviceId}`);
    const data = await res.json();
    const workspace = document.getElementById('criteria-workspace');

    const rawName = serviceNamesById[serviceId] || "";
    const guide = SERVICE_GUIDE[rawName.toLowerCase()];

    workspace.innerHTML = data.map(c => {
        // FIX: Use guide for labels, use criteria (c) for the actual values
        const labelLoc = (guide && guide.location) ? guide.location : "Location / Target";
        const labelContent = (guide && guide.content) ? guide.content : "Required Content";

        return `
            <div class="bg-slate-800 border-l-4 border-emerald-500 rounded-r-xl p-6 mb-6 shadow-lg">
                <div class="mb-6">
                    <span class="text-xs font-bold text-emerald-500 uppercase tracking-widest block mb-2">${labelLoc}</span>
                    <div class="text-xl font-mono text-white bg-slate-950 p-4 rounded border border-slate-700">${c.location}</div>
                </div>
                <div>
                    <span class="text-xs font-bold text-emerald-500 uppercase tracking-widest block mb-2">${labelContent}</span>
                    <div class="text-xl font-mono text-white bg-slate-950 p-4 rounded border border-slate-700 break-all">${c.content}</div>
                </div>
            </div>
        `;
    }).join('');    
}

function showNewCriteriaModal() {
    const rawName = serviceNamesById[selectedServiceId] || "";
    const guide = SERVICE_GUIDE[rawName.toLowerCase()];
    
    const locLabel = document.getElementById('loc-label-text');
    const contentLabel = document.getElementById('content-label-text');

    locLabel.innerText = (guide && guide.location) ? guide.location : "File Location / Target";
    contentLabel.innerText = (guide && guide.content) ? guide.content : "Required Content / Regex";

    document.getElementById('modal-service-id').value = selectedServiceId;
    toggleModal('criteria-modal');
}

async function submitNewCriteria() {
    const sId = document.getElementById('modal-service-id').value;
    const payload = {
        service_id: parseInt(sId),
        host_id: parseInt(serviceToHostMap[sId]), 
        location: document.getElementById('new-location').value,
        content: document.getElementById('new-content').value,
        team_id: 3 // Assign to Admin/White team by default
    };
    
    if(!payload.location || !payload.content) return notify("All fields required", true);

    const res = await fetch('/add_criteria', {
        method: 'POST',
        headers: {'Content-Type': 'application/json'},
        body: JSON.stringify(payload)
    });

    if (res.ok) {
        notify("New criteria added");
        document.getElementById('new-location').value = '';
        document.getElementById('new-content').value = '';
        toggleModal('criteria-modal');
        loadCriteria(selectedServiceId, document.querySelector('#service-list .sidebar-active'));
    } else { 
        notify("Error saving: check backend logs", true); 
    }
}

function toggleModal(id) { document.getElementById(id).classList.toggle('hidden'); }

init();
</script>
</body>
</html>
