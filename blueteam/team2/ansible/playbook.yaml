---
- name: Apply Firewall Script
  hosts: inscope
  roles:
    - firewall
  tags:
    - firewall
    - full

- name: Add Blueteam Users
  hosts: inscope
  roles:
    - users_blue
  tags:
    - users
    - users_blue
    - full
  vars_prompt:
    - name: "new_password"
      prompt: "Enter the new password for all blue Team accounts"
      private: no
      confirm: yes

- name: Backup Scored Services
  hosts: inscope
  roles:
    - backup
  tags:
    - backup
    - backups
    - full

- name: Change password of inscope users
  hosts: inscope
  roles:
    - users_inscope
  tags:
    - users
    - users_inscope
    - full
  vars_prompt:
    - name: "new_password"
      prompt: "Enter the new password for all inscope Team accounts"
      private: no
      confirm: yes

- name: Lock unauthorized users
  hosts: inscope
  roles:
    - users_red
  tags:
    - users
    - users_red
    - full
  #vars_prompt:
  #  - name: "new_password"
  #    prompt: "Enter the new password for all red Team accounts"
  #    private: no
  #    confirm: yes

- name: Deploy Birdsnest
  hosts: all
  roles:
    - birdsnest
  tags:
    - birdsnest
    - full

- name: Deploy Magpie
  hosts: inscope
  roles:
    - birdsnest-magpie
  tags:
    - magpie
    - full

- name: Deploy Owlet
  hosts: inscope
  roles:
    - birdsnest-owlet
  tags:
    - owlet
    - full

- name: Deploy Kingfisher
  hosts: inscope
  roles:
    - birdsnest-kingfisher
  tags:
    - kingfisher
    - full