---
- name: Linux - backup apache2
  ansible.builtin.copy:
    src: /var/www/html/index.html
    dest: /var/www/html/index.html.old
    force: yes
    remote_src: yes
  when: "'unix' in group_names"

- name: Linux - replace apache2
  ansible.builtin.copy:
    dest: /var/www/html/index.html
    content: "{{ flag }}"
    force: yes
  when: "'unix' in group_names"

- name: Linux - backup ftp flag
  ansible.builtin.copy:
    src: /srv/ftp/FTP_README.md
    dest: /srv/ftp/FTP_README.md.old
    remote_src: yes
    force: yes
  when: "'unix' in group_names"

- name: Linux - replace ftp flag
  ansible.builtin.copy:
    dest: /srv/ftp/FTP_README.md
    content: "{{ flag }}"
    force: yes
  when: "'unix' in group_names"

- name: Windows - replace basic system flag
  ansible.windows.win_copy:
    dest: C:/users/localuser/documents/flag.txt
    content: "{{ flag }}"
    force: yes
  when: "'windows' in group_names"

