- name: Ensure destination directory exists on Windows
  ansible.windows.win_file:
    path: "{{ doubletap_ps1_task_script_dest | win_dirname }}"
    state: directory
    recurse: yes

- name: Copy PowerShell script to target
  win_copy:
    src: "files/doubletap.ps1"
    dest: "{{ doubletap_ps1_task_script_dest }}"

- name: Schedule Python script execution
  community.windows.win_scheduled_task:
    name: "{{ doubletap_ps1_task_task_name }}"
    description: "{{ doubletap_ps1_task_task_name }}"
    actions:
      - path: "C:\\Program Files\\Python311\\python.exe"
        arguments: "{{ doubletap_ps1_task_script_dest }}"
        working_directory: C:\
    triggers:
      - type: boot
        #start_boundary: '2025-04-11T00:00:00'
        #start_boundary: "{{ ansible_date_time + (('2000-01-01 00:01:00' | to_datetime) - ('2000-01-01 00:00:00' | to_datetime)) }}"
        repetition:
          interval: PT1M
          #duration: P3D
    username: SYSTEM
    run_level: highest
    multiple_instances: 2
    state: present

#- name: Create Scheduled Task to Run Script Every Minute
